<!doctype html><html><head><meta charset="utf-8"><title>AI test</title></head><body><canvas id="c" width="900" height="1100"></canvas><pre id="out">waiting…</pre><script type="module">
import { readMenuWithAI } from './src/lib/menuAi.js';
import { findPhotos } from './src/lib/dishPhoto.js';
import { jsPDF } from 'jspdf';
const c = document.getElementById('c'), x = c.getContext('2d');
x.fillStyle = '#fdf3dc'; x.fillRect(0, 0, 900, 1100); x.fillStyle = '#5a1e00';
x.font = 'bold 44px serif'; x.fillText('SHREE BALAJI RESTAURANT', 150, 70); x.font = '22px sans-serif'; x.fillText('Mob. 9876543210 · Haidergarh', 300, 105);
x.font = 'bold 30px sans-serif'; x.fillText('MAIN COURSE', 60, 170); x.fillText('Half   Full', 640, 170);
const rows = [['Kadai Paneer', '140', '260'], ['Shahi Paneer', '150', '280'], ['Dal Makhani', '110', '200'], ['Mix Veg', '100', '180'], ['मलाई कोफ्ता', '160', '300']];
x.font = '28px sans-serif'; rows.forEach((r, i) => { const y = 220 + i * 50; x.fillText(r[0], 60, y); x.fillText('............', 330, y); x.fillText(r[1], 650, y); x.fillText(r[2], 760, y); });
x.font = 'bold 30px sans-serif'; x.fillText('CHINESE', 60, 500);
const r2 = [['Veg Hakka Noodles', '₹ 90/-'], ['Chilli Paneer Dry', '₹ 160/-'], ['वेज मंचूरियन', '₹ 120/-'], ['Veg Spring Roll (6 pcs)', '₹ 110/-']];
x.font = '28px sans-serif'; r2.forEach((r, i) => { const y = 550 + i * 50; x.fillText(r[0], 60, y); x.fillText(r[1], 700, y); });
x.font = 'bold 30px sans-serif'; x.fillText('SHAKES  (All ₹ 80)', 60, 800); x.font = '28px sans-serif'; x.fillText('Mango Shake     Oreo Shake     Banana Shake', 60, 850);
x.font = '20px sans-serif'; x.fillText('* GST extra as applicable', 60, 1050);
const out = document.getElementById('out'); const log = (s) => { out.textContent += '\n' + s; };
const lib = [{ key: 'kadai_paneer', name: 'Kadai Paneer' }, { key: 'dal_makhani', name: 'Dal Makhani' }, { key: 'chowmein', name: 'Veg Chowmein' }, { key: 'paneer_tikka', name: 'Paneer Tikka' }];
const t0 = Date.now();
c.toBlob(async (blob) => {
  try {
    const img = new File([blob], 'menu.jpg', { type: 'image/jpeg' });
    const r = await readMenuWithAI([img], lib, (m) => log(m));
    log('IMAGE ' + r.engine + ' ' + ((Date.now() - t0) / 1000) + 's ' + r.dishes.length + ' dishes');
    r.dishes.forEach((d) => log(`  ${d.name} | ${d.price} | ${d.cat} | key=${d.photoKey} | ${d.search} | ${d.story}`));
    const ph = await findPhotos(r.dishes.slice(0, 6).map((d, i) => ({ id: i, name: d.name, search: d.search })));
    Object.entries(ph).forEach(([i, p]) => log(`  PHOTO ${r.dishes[i].name}: ${p.url}`));
    const pdf = new jsPDF({ unit: 'px', format: [900, 1100] }); pdf.addImage(c.toDataURL('image/jpeg', 0.9), 'JPEG', 0, 0, 900, 1100);
    const f = new File([pdf.output('blob')], 'menu.pdf', { type: 'application/pdf' });
    const r3 = await readMenuWithAI([f], lib, () => {});
    log('PDF ' + r3.engine + ' ' + r3.dishes.length + ' dishes: ' + r3.dishes.map((d) => d.name + '=' + d.price).join(', '));
    log('DONE');
  } catch (e) { log('ERROR ' + e.message + ' :: ' + (e.raw || '')); }
}, 'image/jpeg', 0.92);
</script></body></html>
