<!doctype html><html><head><meta charset="utf-8"><title>AI test</title></head><body><pre id="out">waiting…</pre><script type="module">
import { readMenuWithAI } from './src/lib/menuAi.js';
const out = document.getElementById('out'); const log = (s) => { out.textContent += '\n' + s; };
const t0 = Date.now();
(async () => { try {
  const b = await (await fetch('./t9x/m.pdf')).blob(); const f = new File([b], 'menu.pdf', { type: 'application/pdf' });
  const r = await readMenuWithAI([f], [{ key: 'pbm', name: 'Paneer Butter Masala' }], (m) => log(m));
  log(`RESULT ${r.dishes.length} dishes in ${(Date.now() - t0) / 1000}s, pages ${r.pages}, failed: ${r.failed.join(',')}`);
  window.__dishes = r.dishes; log('DONE');
} catch (e) { log('ERROR ' + e.message + ' :: ' + (e.raw || '')); } })();
</script></body></html>
